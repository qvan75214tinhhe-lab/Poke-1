name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xác định thư mục project
        run: |
          find_settings() { find "$1" \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.git/*' | head -n1; }
          SETTINGS=$(find_settings .)
          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -iname '*.zip' -not -path './.git/*' | head -n1)
            if [ -z "$ZIP" ]; then
              echo "Không thấy project hoặc file zip. Các file trong repo:"
              find . -not -path './.git/*' | head -50
              exit 1
            fi
            echo "Giải nén: $ZIP"
            unzip -q "$ZIP" -d src
            SETTINGS=$(find_settings src)
          fi
          [ -n "$SETTINGS" ] || { echo "Không tìm thấy settings.gradle"; find . -not -path './.git/*' | head -50; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Project: $(dirname "$SETTINGS")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài Android SDK (tự chấp nhận license)
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PokeMMO-Bot-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
